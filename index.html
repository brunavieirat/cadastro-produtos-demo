<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Produtos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="app-header__marca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <h1>Cadastro de Produtos</h1>
    </div>
  </header>

  <main>

    <!-- ===================================================
         Formulário de cadastro (só layout por enquanto,
         ainda não está funcionando)

         O botão "toggle-cadastro" também é só visual por ora:
         a ideia é que ele mostre/esconda o formulário, mas
         essa lógica ainda não foi implementada em JS.
         =================================================== -->
    <section class="cadastro-produto">
      <div class="cadastro-produto__topo">
        <h2>Cadastrar novo produto</h2>
        <button type="button" id="toggle-cadastro" class="btn-toggle" aria-label="Mostrar ou esconder formulário">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>

      <form id="form-cadastro">
        <div class="campo">
          <label for="nome">Nome do produto</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Tênis Esportivo" />
        </div>

        <div class="campo">
          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" placeholder="Ex: 259.90" step="0.01" />
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <input type="text" id="categoria" name="categoria" placeholder="Ex: Calçados" />
        </div>

        <div class="campo campo--largo">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" rows="3" placeholder="Fale um pouco sobre o produto..."></textarea>
        </div>

        <div class="campo campo--largo">
          <label for="imagem">URL da imagem</label>
          <input type="text" id="imagem" name="imagem" placeholder="https://..." />
        </div>

        <button type="submit" class="btn btn-primario">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Cadastrar Produto
        </button>
      </form>
    </section>

    <!-- ===================================================
         Barra de busca (só layout por enquanto,
         ainda não está funcionando)
         =================================================== -->
    <section class="busca">
      <svg class="busca__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="busca-produto" placeholder="Buscar produto..." />
    </section>

    <!-- Aqui dentro o JavaScript coloca os cards de produto -->
    <div id="lista-produtos" class="lista-produtos"></div>

  </main>

  <script src="script.js"></script>
</body>
</html>
